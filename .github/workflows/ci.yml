name: CI/CD Pipeline


on:
  push:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Give Permision
        run: chmod +x scripts/health.sh

      - name: Run Health Script
        run: ./scripts/health.sh

      - name: Build Docker Image
        run: |
          docker build -t luka-nginx:v1 .

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Deploy simulation
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh


      - name: Docker login
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: |
          docker build -t lukaj988/luka-nginx:latest .

      - name: Push image
        run: |
          docker push lukaj988/luka-nginx:latest
